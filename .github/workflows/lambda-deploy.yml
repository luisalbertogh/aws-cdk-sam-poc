name: AWS Lambda - Deploy SAM Application

on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
  workflow_dispatch: 
    inputs:
      lambda_folder:
        description: "Lambda folder name (e.g. chef-agent, nutritionist-agent, instructor-agent)"
        required: true
        default: OFFAPI
        type: string

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  CDK_DEFAULT_REGION: eu-central-1
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  LAMBDA_FOLDER: ${{ github.event.inputs.lambda_folder || 'OFFAPI' }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
  
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "lambdas/${{ env.LAMBDA_FOLDER }}/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          # Install a specific version of uv.
          version: "0.11.6"

      - name: Install test dependencies
        run: |
            cd lambdas/${{ env.LAMBDA_FOLDER }}
            uv sync --all-extras --dev

      - name: Run unit tests
        run: |
            cd lambdas/${{ env.LAMBDA_FOLDER }}
            uv run pytest tests/ -v --cov=src/

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-24.04-arm
    needs: test
    # Only deploy on push to main, not on PRs
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "lambdas/${{ env.LAMBDA_FOLDER }}/.python-version"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37  # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cdk-infra-plan
          audience: sts.amazonaws.com

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@d78e1a4a9656d3b223e59b80676a797f20093133  # v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set environment variables for SAM deploy
        run: |
          echo "SAM_DEPLOYMENT_BUCKET=$(aws cloudformation list-exports \
            --query "Exports[?Name=='AgentCorePocStorageStack-BucketName'].Value" \
            --output text)" >> $GITHUB_ENV

          echo "LAMBDA_EXECUTION_ROLE_ARN=arn:aws:iam::741881499996:role/AgentCorePocComputeStack-openFoodFactsAPIServiceRol-iVphXGoScYlP" >> $GITHUB_ENV

      - name: Test env variables
        run: |
          echo "SAM_DEPLOYMENT_BUCKET: ${{ env.SAM_DEPLOYMENT_BUCKET }}"
          echo "LAMBDA_EXECUTION_ROLE_ARN: ${{ env.LAMBDA_EXECUTION_ROLE_ARN }}"
          echo "SAM_DEPLOYMENT_BUCKET: ${SAM_DEPLOYMENT_BUCKET}"
          echo "LAMBDA_EXECUTION_ROLE_ARN: ${LAMBDA_EXECUTION_ROLE_ARN}"

      - name: SAM Build
        run: |
          cd lambdas/${{ env.LAMBDA_FOLDER }}
          sam build

      - name: SAM Deploy
        run: |
          cd lambdas/${{ env.LAMBDA_FOLDER }}
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket "${SAM_DEPLOYMENT_BUCKET}"
