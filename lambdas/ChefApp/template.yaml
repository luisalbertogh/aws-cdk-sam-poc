AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Chef App - Mock chef agent for dish suggestions


Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]           # Graviton2 – cheaper & faster for Python
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: chef-app
    Layers:
      - !Ref CommonDependenciesLayer  # Attach layer to all functions by default
    Tracing: Active                   # X-Ray tracing
    Tags:
      Project: Commission-Chef-Assistant
      Contact: Luis Garcia
      Usage: Cloud POC

Resources:

  # ----- Lambda Layer: shared Python dependencies -----
  CommonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: chefapp-common-dependencies
      Description: Shared Python packages (aws-lambda-powertools, pydantic, etc.)
      ContentUri: layers/common_dependencies/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Retain         # Don't delete old versions on redeploy
    Metadata:
      BuildMethod: python3.12         # SAM installs requirements.txt automatically
      BuildArchitecture: arm64        # Use arm64 for cheaper, faster Lambda execution

  # ----- IAM Role -----
  ChefAppFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ChefAppRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole  # CloudWatch Logs write
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess                  # X-Ray tracing
      Tags:
        - Key: Project
          Value: Commission-Chef-Assistant
        - Key: Contact
          Value: Daniel Parres
        - Key: Usage
          Value: AgentCore POC

  # ----- CloudWatch Log Group -----
  ChefAppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ChefApp"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: Commission-Chef-Assistant
        - Key: Contact
          Value: Daniel Parres
        - Key: Usage
          Value: AgentCore POC

  # ----- Lambda Function -----
  ChefAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ChefApp"
      CodeUri: src/
      Handler: main.lambda_handler
      Description: Mock chef agent that provides dish suggestions
      Role: !GetAtt ChefAppFunctionRole.Arn

Outputs:
  ChefAppFunctionArn:
    Description: ARN of the ChefApp Lambda function
    Value: !GetAtt ChefAppFunction.Arn
  ChefAppFunctionRoleArn:
    Description: ARN of the ChefApp IAM Role
    Value: !GetAtt ChefAppFunctionRole.Arn
  ChefAppFunctionName:
    Description: Name of the ChefApp Lambda function
    Value: !Ref ChefAppFunction
